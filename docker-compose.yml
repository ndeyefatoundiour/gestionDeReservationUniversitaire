version: '3.8'

services:
  app:
    build: .
    container_name: resasalles_app
    ports:
      - "8085:80"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=development
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: resasalles_db
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: reservation_salles
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
